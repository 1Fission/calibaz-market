<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaliBaz Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: sans-serif; background:#0f1620; color:#f2e9d8; margin:0; padding:16px; }
  h1 { font-size:20px; margin-bottom:4px; }
  p.sub { color:#9aa5b1; font-size:13px; margin-top:0; margin-bottom:20px; }
  .category { background:#1b2530; border:1px solid #2a3644; border-radius:10px; padding:16px; margin-bottom:10px; font-size:15px; }
  .category:active { background:#232f3d; }
  .back { color:#9aa5b1; font-size:14px; margin-bottom:16px; display:inline-block; }
  .vendor { background:#1b2530; border:1px solid #2a3644; border-radius:10px; padding:16px; margin-bottom:10px; font-size:15px; }
  .vendor:active { background:#232f3d; }
  .product { background:#1b2530; border:1px solid #2a3644; border-radius:10px; padding:16px; margin-bottom:10px; }
  .pimg { width:100%; border-radius:8px; margin-bottom:10px; }
  .product h3 { margin:0 0 6px 0; font-size:16px; }
  .product .price { color:#f2c94c; font-weight:bold; margin-bottom:6px; }
  .product .desc { color:#9aa5b1; font-size:13px; margin-bottom:12px; }
  .product button { background:#2f8f4e; color:#fff; border:none; border-radius:8px; padding:10px 14px; font-size:14px; width:100%; }
  .trust { background:#1b2530; border:1px solid #2a3644; border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13px; color:#9aa5b1; }
  .ad { display:none; position:relative; background:linear-gradient(135deg,#2a3644,#1b2530); border:1px solid #f2c94c; border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:14px; }
  .ad .adtag { font-size:10px; color:#f2c94c; letter-spacing:1px; margin-bottom:4px; }
  .search { width:100%; box-sizing:border-box; background:#1b2530; border:1px solid #2a3644; border-radius:10px; padding:12px 14px; color:#f2e9d8; font-size:15px; margin-bottom:14px; outline:none; }
  .sec { font-size:14px; font-weight:bold; margin:4px 0 8px; }
  .strip { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; }
  .lcard { flex:0 0 130px; background:#1b2530; border:1px solid #2a3644; border-radius:10px; padding:8px; }
  .lcard img { width:100%; height:90px; object-fit:cover; border-radius:6px; margin-bottom:6px; }
  .lname { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lprice { font-size:12px; color:#f2c94c; font-weight:bold; }
  .strip { align-items:flex-start; }
  .lcard { flex:0 0 140px !important; width:140px; height:auto !important; min-height:0 !important; box-sizing:border-box; }
  .lprice { white-space:normal; }
  .lcard img { height:90px !important; max-height:90px !important; display:block; }
  .strip { max-height:210px; overflow-y:hidden; }
  .lcard img { display:none !important; }
  .strip { max-height:none; }
  .trust { background:none !important; border:none !important; padding:0 2px !important; margin-bottom:12px !important; font-size:12px !important; }
  .search { margin-top:-6px !important; margin-bottom:10px !important; }
  .titlerow { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .titlerow h1 { flex:1; min-width:0; }
  .escpill { position:relative; overflow:hidden; flex:0 0 auto; border:1px solid #f2c94c; color:#f2c94c; background:#1b2530; border-radius:999px; padding:5px 10px; font-size:12px; font-weight:bold; cursor:pointer; white-space:nowrap; }
  .escpill::after { content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform:skewX(-20deg); animation:escsweep 4s ease-in-out infinite; }
  @keyframes escsweep { 0% { left:-60%; } 35%, 100% { left:130%; } }
  @media (prefers-reduced-motion: reduce) { .escpill::after { animation:none; display:none; } }
  .empty { color:#9aa5b1; font-size:14px; text-align:center; margin-top:30px; }
</style>
</head>
<body>
  <div class="titlerow"><h1>CaliBaz Market</h1><div class="escpill" onclick="Telegram.WebApp.openTelegramLink('https://t.me/FissionHelp?text=' + encodeURIComponent('Hi, I would like to use escrow on CaliBaz Market.'))">🔒 Free escrow</div></div>
  <p class="sub">Your trusted multi-vendor marketplace</p>

  <input id="searchBox" class="search" type="search" placeholder="🔍 Search products, vendors or escrow" autocomplete="off">
  <div id="searchResults" style="display:none;"></div>
  <div id="adBanner" class="ad"><div class="adtag">SPONSORED</div><div class="adtext"></div></div>
  <div id="latestWrap" style="display:none;"><div class="sec">🆕 Latest listings</div><div id="latest" class="strip"></div></div>
  <div id="categoriesView">
    <div id="categories"></div>
  </div>

  <div id="vendorsView" style="display:none;">
    <a class="back" id="backToCategoriesBtn">&larr; Back to categories</a>
    <h2 id="categoryTitle" style="font-size:17px;"></h2>
    <div id="vendors"></div>
  </div>

  <div id="productsView" style="display:none;">
    <a class="back" id="backToVendorsBtn">&larr; Back to vendors</a>
    <h2 id="vendorTitle" style="font-size:17px;"></h2>
    <div id="products"></div>
  </div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  const categories = [
    "Custom/Handmade Requests",
    "Digital Services",
    "Herbarium & Herbal Products",
    "Electronics & Gadgets",
    "Fruit Juice & Related Products",
    "Cake & Related Products",
    "Land & Housing",
    "Fashion & Apparel",
    "Home & Lifestyle",
    "Beauty & Personal Care",
    "Food & Related Products"
  ];

  const categoriesView = document.getElementById("categoriesView");
  const vendorsView = document.getElementById("vendorsView");
  const productsView = document.getElementById("productsView");
  const categoryTitle = document.getElementById("categoryTitle");
  const vendorTitle = document.getElementById("vendorTitle");
  const vendorsContainer = document.getElementById("vendors");
  const productsContainer = document.getElementById("products");
  const backToCategoriesBtn = document.getElementById("backToCategoriesBtn");
  const backToVendorsBtn = document.getElementById("backToVendorsBtn");

  let currentCategory = null;
  let currentCategoryProducts = [];

  const container = document.getElementById("categories");

  function adEvent(t) { try { fetch("https://calibaz-backend.onrender.com/ad/event?type=" + t, { headers: { "x-init-data": Telegram.WebApp.initData }, keepalive: true }).catch(() => {}); } catch (e) {} }
  fetch("https://calibaz-backend.onrender.com/ad")
    .then(r => r.json())
    .then(ad => {
      if (!ad || !ad.text) return;
      const el = document.getElementById("adBanner");
      el.querySelector(".adtext").textContent = ad.text;
      adEvent("view");
      el.style.display = "block";
      el.addEventListener("click", () => {
        adEvent("click");
        if (/^https:\/\/t\.me\//.test(ad.url)) { Telegram.WebApp.openTelegramLink(ad.url); if (/^https:\/\/t\.me\/calibazbot/i.test(ad.url)) setTimeout(() => Telegram.WebApp.close(), 300); }
        else Telegram.WebApp.openLink(ad.url);
      });
    })
    .catch(() => {});

  let searchData = [];
  const searchBox = document.getElementById("searchBox");
  const searchResults = document.getElementById("searchResults");
  searchBox.addEventListener("input", () => {
    const q = searchBox.value.trim().toLowerCase();
    const cats = document.getElementById("categories");
    const latestWrap = document.getElementById("latestWrap");
    if (!q) {
      searchResults.style.display = "none";
      cats.style.display = "block";
      latestWrap.style.display = document.getElementById("latest").children.length ? "block" : "none";
      return;
    }
    cats.style.display = "none";
    latestWrap.style.display = "none";
    searchResults.style.display = "block";
    searchResults.innerHTML = "";
    const wantsEscrow = q.includes("escrow") || (q.length >= 3 && "escrow".startsWith(q));
    if (wantsEscrow) { const ec = document.createElement("div"); ec.className = "vendor"; ec.textContent = "🔒 Free escrow · tap to ask"; ec.addEventListener("click", () => Telegram.WebApp.openTelegramLink("https://t.me/FissionHelp?text=" + encodeURIComponent("Hi, I would like to use escrow on CaliBaz Market."))); searchResults.appendChild(ec); }
    const hits = searchData.filter(p =>
      !/escrow/i.test(p.vendorName || "") &&
      [p.name, p.description, p.vendorName, p.vendor, p.category].join(" ").toLowerCase().includes(q)
    );
    if (hits.length === 0) {
      if (!wantsEscrow) searchResults.innerHTML = '<div class="empty">No matches found.</div>';
      return;
    }
    hits.slice(0, 30).forEach(p => {
      const div = document.createElement("div");
      div.className = "vendor";
      const n = document.createElement("div");
      n.textContent = p.name + (p.verified ? " ✅" : "");
      const m = document.createElement("div");
      m.style.cssText = "font-size:12px;color:#9aa5b1;margin-top:4px;";
      m.textContent = (p.vendorName || p.vendor) + " · " + p.category;
      div.appendChild(n);
      div.appendChild(m);
      div.addEventListener("click", () => {
        searchBox.value = "";
        searchBox.dispatchEvent(new Event("input"));
        showVendors(p.category);
      });
      searchResults.appendChild(div);
    });
  });

  function renderLatest(all) {
    const items = all
      .filter(p => p.category !== "Test Items (Admin Only)" && !/escrow/i.test(p.vendorName || ""))
      .sort((a, b) => Number(b.id) - Number(a.id))
      .slice(0, 8);
    if (items.length === 0) return;
    const strip = document.getElementById("latest");
    strip.innerHTML = "";
    items.forEach(p => {
      const card = document.createElement("div");
      card.className = "lcard";
      if (p.image) {
        const img = document.createElement("img");
        img.src = "https://calibaz-backend.onrender.com/image/" + p.image;
        card.appendChild(img);
      }
      const n = document.createElement("div");
      n.className = "lname";
      n.textContent = p.name;
      const pr = document.createElement("div");
      pr.className = "lprice";
      pr.textContent = /^[0-9]+$/.test(p.price) ? p.price + " Stars" : p.price;
      card.appendChild(n);
      card.appendChild(pr);
      card.addEventListener("click", () => showVendors(p.category));
      strip.appendChild(card);
    });
    document.getElementById("latestWrap").style.display = "block";
  }

  const ICONS = {
    "Custom/Handmade Requests": "🎁",
    "Digital Services": "💻",
    "Herbarium & Herbal Products": "🌿",
    "Electronics & Gadgets": "📱",
    "Fruit Juice & Related Products": "🍹",
    "Cake & Related Products": "🎂",
    "Land & Housing": "🏠",
    "Fashion & Apparel": "👗",
    "Home & Lifestyle": "🛋️",
    "Beauty & Personal Care": "💄",
    "Food & Related Products": "🍲"
  };

  function updateCounts(all) {
    document.querySelectorAll("#categories .category[data-cat]").forEach(el => {
      const name = el.dataset.cat;
      const vendors = new Set(
        all.filter(p => p.category === name && !/escrow/i.test(p.vendorName || ""))
           .map(p => p.vendor + "||" + (p.vendorName || ""))
      );
      const base = (ICONS[name] || "🛍️") + " " + name;
      if (vendors.size === 0) {
        el.textContent = base + " · coming soon";
        el.style.opacity = "0.55";
      } else {
        el.textContent = base + " · " + vendors.size + (vendors.size === 1 ? " vendor" : " vendors");
      }
    });
  }

  fetch("https://calibaz-backend.onrender.com/products", { headers: { "x-init-data": Telegram.WebApp.initData } })
    .then(r => r.json())
    .then(all => {
      updateCounts(all);
      renderLatest(all);
      searchData = all;
      try {
        const shopParam = (new URLSearchParams(location.search).get("shop") || "").replace(/^@/, "").toLowerCase();
        if (shopParam) {
          const mine = all.filter(p => String(p.vendor).toLowerCase() === shopParam && p.category !== "Test Items (Admin Only)" && !/escrow/i.test(p.vendorName || ""));
          if (mine.length) {
            const first = mine[0];
            currentCategoryProducts = mine.map(p => Object.assign({}, p, { vendorName: first.vendorName }));
            categoriesView.style.display = "none";
            showProducts(first.vendor + "||" + (first.vendorName || ""), first.vendorName || first.vendor);
            const nb = backToVendorsBtn.cloneNode(true);
            backToVendorsBtn.parentNode.replaceChild(nb, backToVendorsBtn);
            nb.textContent = "← Browse market";
            nb.addEventListener("click", () => { location.href = location.pathname; });
          }
        }
      } catch (e) {}
      if (all.some(p => p.category === "Test Items (Admin Only)")) {
        const div = document.createElement("div");
        div.className = "category";
        div.textContent = "🧪 Test Items (Admin Only)";
        div.addEventListener("click", () => showVendors("Test Items (Admin Only)"));
        container.appendChild(div);
      }
    })
    .catch(() => {});
  categories.forEach(name => {
    const div = document.createElement("div");
    div.className = "category";
    div.dataset.cat = name; div.textContent = (ICONS[name] || "🛍️") + " " + name;
    div.addEventListener("click", () => showVendors(name));
    container.appendChild(div);
  });

  backToCategoriesBtn.addEventListener("click", () => {
    vendorsView.style.display = "none";
    categoriesView.style.display = "block";
  });

  backToVendorsBtn.addEventListener("click", () => {
    productsView.style.display = "none";
    vendorsView.style.display = "block";
  });

  async function showVendors(categoryName) {
    currentCategory = categoryName;
    categoryTitle.textContent = categoryName;
    vendorsContainer.innerHTML = "Loading...";
    categoriesView.style.display = "none";
    vendorsView.style.display = "block";

    try {
      const res = await fetch("https://calibaz-backend.onrender.com/products", { headers: { "x-init-data": Telegram.WebApp.initData } });
      const allProducts = await res.json();
      currentCategoryProducts = allProducts.filter(p => p.category === categoryName);

      vendorsContainer.innerHTML = "";

      if (currentCategoryProducts.length === 0) {
        vendorsContainer.innerHTML = '<div class="empty">No vendors in this category yet.</div>';
        return;
      }

      const vendorMap = {};
      currentCategoryProducts.forEach(p => {
        const vk = p.vendor + "||" + (p.vendorName || "");
      if (!vendorMap[vk]) {
          vendorMap[vk] = (p.vendorName || p.vendor) + (p.verified ? " ✅" : "");
        }
      });

      Object.keys(vendorMap).sort((a, b) => vendorMap[b].includes("✅") - vendorMap[a].includes("✅")).forEach(vendorUsername => {
        const div = document.createElement("div");
        div.className = "vendor";
        div.textContent = vendorMap[vendorUsername];
        const rp = currentCategoryProducts.find(p => (p.vendor || "").replace("@", "").toLowerCase() === String(vendorUsername).split("||")[0].replace("@", "").toLowerCase() && p.ratingCount > 0);
        if (rp) { const rs = document.createElement("span"); rs.style.cssText = "float:right;color:#f2c94c;font-size:13px;"; rs.textContent = "⭐ " + rp.ratingAvg.toFixed(1) + " (" + rp.ratingCount + ")"; div.appendChild(rs); }
        div.addEventListener("click", () => showProducts(vendorUsername, vendorMap[vendorUsername]));
        vendorsContainer.appendChild(div);
      });
    } catch (err) {
      vendorsContainer.innerHTML = '<div class="empty">Could not load vendors. Please try again.</div>';
    }
  }

  function showProducts(vendorUsername, vendorDisplayName) {
    vendorTitle.textContent = vendorDisplayName;
    vendorsView.style.display = "none";
    productsView.style.display = "block";
    productsContainer.innerHTML = "";
    let shopBtn = document.getElementById("shareShopBtn");
    if (shopBtn) shopBtn.remove();
    const shopUser = String(vendorUsername).split("||")[0];
    if (/^[A-Za-z0-9_]{3,40}$/.test(shopUser)) {
      shopBtn = document.createElement("button");
      shopBtn.id = "shareShopBtn";
      shopBtn.textContent = "🔗 Share this shop";
      shopBtn.style.margin = "0 0 10px 0";
      shopBtn.addEventListener("click", () => {
        fetch("https://calibaz-backend.onrender.com/shopcode?u=" + encodeURIComponent(shopUser))
          .then(r => r.json())
          .then(d => {
            if (!d || !d.code) return;
            const shopLink = "https://t.me/CaliBazbot?start=shop_" + encodeURIComponent(d.code);
            Telegram.WebApp.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(shopLink) + "&text=" + encodeURIComponent("Shop " + vendorDisplayName + " on CaliBaz Market"));
          })
          .catch(() => {});
      });
      productsContainer.parentNode.insertBefore(shopBtn, productsContainer);
    }

    const filtered = currentCategoryProducts.filter(p => (p.vendor + "||" + (p.vendorName || "")) === vendorUsername);

    if (filtered.length === 0) {
      productsContainer.innerHTML = '<div class="empty">No products listed yet.</div>';
      return;
    }

    filtered.forEach(p => {
      const div = document.createElement("div");
      div.className = "product";
      div.innerHTML = `
        ${p.image ? `<img class="pimg" src="https://calibaz-backend.onrender.com/image/${p.image}">` : ""}
        <h3>${p.name}</h3>
        <div class="price">${/^[0-9]+$/.test(p.price) ? p.price + " Stars" : p.price}</div>
        <div class="desc">${p.description}</div>
        <button>I'm Interested</button>
        <button class="sharebtn" style="margin-top:6px;background:transparent;border:1px solid currentColor;">🔗 Share</button>
      `;
      div.querySelector("button").addEventListener("click", () => {
        Telegram.WebApp.openTelegramLink("https://t.me/CaliBazbot?start=deal_" + encodeURIComponent(p.id));
        setTimeout(() => Telegram.WebApp.close(), 300);
      });
      div.querySelector(".sharebtn").addEventListener("click", () => {
        const link = "https://t.me/CaliBazbot?start=deal_" + encodeURIComponent(p.id);
        const txt = p.name + " - " + (/^[0-9]+$/.test(p.price) ? p.price + " Stars" : p.price) + " on CaliBaz Market";
        try { fetch("https://calibaz-backend.onrender.com/share/event?id=" + encodeURIComponent(p.id)); } catch (e) {}
        Telegram.WebApp.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent(txt));
      });
      productsContainer.appendChild(div);
    });
    const escStrip = document.createElement("div");
    escStrip.className = "vendor";
    escStrip.style.marginTop = "10px";
    escStrip.textContent = "🛡️ Escrow available · Ask support";
    escStrip.addEventListener("click", () => {
      Telegram.WebApp.openTelegramLink("https://t.me/FissionHelp?text=" + encodeURIComponent("Hi, I'd like escrow for a deal on CaliBaz Market."));
    });
    productsContainer.appendChild(escStrip);
  }
</script>
</body>
</html>
