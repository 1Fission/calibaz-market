<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaliBaz Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: sans-serif; background:#0f1620; color:#f2e9d8; margin:0; padding:16px; }
  h1 { font-size:20px; margin-bottom:4px; }
  p.sub { color:#9aa5b1; font-size:13px; margin-top:0; margin-bottom:20px; }
  .category { background:#1b2530; border:1px solid #2a3644; border-radius:10px; padding:16px; margin-bottom:10px; font-size:15px; }
  .category:active { background:#232f3d; }
  .back { color:#9aa5b1; font-size:14px; margin-bottom:16px; display:inline-block; }
  .vendor { background:#1b2530; border:1px solid #2a3644; border-radius:10px; padding:16px; margin-bottom:10px; font-size:15px; }
  .vendor:active { background:#232f3d; }
  .product { background:#1b2530; border:1px solid #2a3644; border-radius:10px; padding:16px; margin-bottom:10px; }
  .product h3 { margin:0 0 6px 0; font-size:16px; }
  .product .price { color:#f2c94c; font-weight:bold; margin-bottom:6px; }
  .product .desc { color:#9aa5b1; font-size:13px; margin-bottom:12px; }
  .product button { background:#2f8f4e; color:#fff; border:none; border-radius:8px; padding:10px 14px; font-size:14px; width:100%; }
  .empty { color:#9aa5b1; font-size:14px; text-align:center; margin-top:30px; }
</style>
</head>
<body>
  <h1>CaliBaz Market</h1>
  <p class="sub">Your trusted multi-vendor marketplace</p>

  <div id="categoriesView">
    <div id="categories"></div>
  </div>

  <div id="vendorsView" style="display:none;">
    <a class="back" id="backToCategoriesBtn">&larr; Back to categories</a>
    <h2 id="categoryTitle" style="font-size:17px;"></h2>
    <div id="vendors"></div>
  </div>

  <div id="productsView" style="display:none;">
    <a class="back" id="backToVendorsBtn">&larr; Back to vendors</a>
    <h2 id="vendorTitle" style="font-size:17px;"></h2>
    <div id="products"></div>
  </div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  const categories = [
    "Fruit Juice & Related Products",
    "Cake & Related Products",
    "Herbarium & Herbal Products",
    "Land & Housing",
    "Fashion & Apparel",
    "Home & Lifestyle",
    "Electronics & Gadgets",
    "Beauty & Personal Care",
    "Digital Services",
    "Food & Related Products",
    "Custom/Handmade Requests"
  ];

  const categoriesView = document.getElementById("categoriesView");
  const vendorsView = document.getElementById("vendorsView");
  const productsView = document.getElementById("productsView");
  const categoryTitle = document.getElementById("categoryTitle");
  const vendorTitle = document.getElementById("vendorTitle");
  const vendorsContainer = document.getElementById("vendors");
  const productsContainer = document.getElementById("products");
  const backToCategoriesBtn = document.getElementById("backToCategoriesBtn");
  const backToVendorsBtn = document.getElementById("backToVendorsBtn");

  let currentCategory = null;
  let currentCategoryProducts = [];

  const container = document.getElementById("categories");
  categories.forEach(name => {
    const div = document.createElement("div");
    div.className = "category";
    div.textContent = name;
    div.addEventListener("click", () => showVendors(name));
    container.appendChild(div);
  });

  backToCategoriesBtn.addEventListener("click", () => {
    vendorsView.style.display = "none";
    categoriesView.style.display = "block";
  });

  backToVendorsBtn.addEventListener("click", () => {
    productsView.style.display = "none";
    vendorsView.style.display = "block";
  });

  async function showVendors(categoryName) {
    currentCategory = categoryName;
    categoryTitle.textContent = categoryName;
    vendorsContainer.innerHTML = "Loading...";
    categoriesView.style.display = "none";
    vendorsView.style.display = "block";

    try {
      const res = await fetch("https://calibaz-backend.onrender.com/products");
      const allProducts = await res.json();
      currentCategoryProducts = allProducts.filter(p => p.category === categoryName);

      vendorsContainer.innerHTML = "";

      if (currentCategoryProducts.length === 0) {
        vendorsContainer.innerHTML = '<div class="empty">No vendors in this category yet.</div>';
        return;
      }

      const vendorMap = {};
      currentCategoryProducts.forEach(p => {
        if (!vendorMap[p.vendor]) {
          vendorMap[p.vendor] = p.vendorName || p.vendor;
        }
      });

      Object.keys(vendorMap).forEach(vendorUsername => {
        const div = document.createElement("div");
        div.className = "vendor";
        div.textContent = vendorMap[vendorUsername];
        div.addEventListener("click", () => showProducts(vendorUsername, vendorMap[vendorUsername]));
        vendorsContainer.appendChild(div);
      });
    } catch (err) {
      vendorsContainer.innerHTML = '<div class="empty">Could not load vendors. Please try again.</div>';
    }
  }

  function showProducts(vendorUsername, vendorDisplayName) {
    vendorTitle.textContent = vendorDisplayName;
    vendorsView.style.display = "none";
    productsView.style.display = "block";
    productsContainer.innerHTML = "";

    const filtered = currentCategoryProducts.filter(p => p.vendor === vendorUsername);

    if (filtered.length === 0) {
      productsContainer.innerHTML = '<div class="empty">No products listed yet.</div>';
      return;
    }

    filtered.forEach(p => {
      const div = document.createElement("div");
      div.className = "product";
      div.innerHTML = `
        <h3>${p.name}</h3>
        <div class="price">${p.price} Stars</div>
        <div class="desc">${p.description}</div>
        <button>I'm Interested</button>
      `;
      div.querySelector("button").addEventListener("click", () => {
        Telegram.WebApp.openTelegramLink(`https://t.me/${p.vendor}`);
      });
      productsContainer.appendChild(div);
    });
  }
</script>
</body>
</html>
